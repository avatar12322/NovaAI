[package]
name = "nova-worker"
version = "0.1.0"
edition = "2024"
description = "NovaAI Worker — wychodzące połączenie z serwerem NovaAI, pliki i git w udostępnionych katalogach"
license = "UNLICENSED"
publish = false

[features]
default = ["tls"]
# TLS (rustls) dla https/wss. Bez tej cechy tylko http/ws — do kontroli kompilacji na innych targetach.
tls = ["reqwest/rustls", "tokio-tungstenite/rustls-tls-native-roots"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dunce = "1.0.5"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "process", "sync", "io-util"] }
tokio-tungstenite = { version = "0.30.0" }
toml = "1.1.6"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
