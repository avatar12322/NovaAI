# Lokalny Postgres dla dev/test (Docker Desktop na Windows/macOS lub Docker na Linux).
# Uruchomienie: docker compose -f infra/compose.yaml up -d
# Port hosta 54329 jest zgodny z .env.example i scripts/pg-local.sh.
name: novaai
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      # Tylko lokalny dev, port wystawiony wyłącznie na loopback hosta.
      POSTGRES_PASSWORD: postgres_dev_only
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
